<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0a12"/>
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#1c1a2e" stroke-width="1"/>

  <!-- Glow effects -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="250" r="230" fill="url(#glow)" />

  <!-- Radiating structure -->
  <g stroke="#2d2b47" stroke-width="2">
    <!-- Center to branch nodes -->
    <line x1="400" y1="250" x2="250" y2="150" />
    <line x1="400" y1="250" x2="550" y2="150" />
    <line x1="400" y1="250" x2="200" y2="250" />
    <line x1="400" y1="250" x2="600" y2="250" />
    <line x1="400" y1="250" x2="280" y2="370" />
    <line x1="400" y1="250" x2="520" y2="370" />
  </g>

  <!-- Surrounding connection loops -->
  <circle cx="400" cy="250" r="160" fill="none" stroke="#2d2b47" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="400" cy="250" r="200" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Branch node cards -->
  <!-- Top Left -->
  <g transform="translate(200, 110)">
    <rect width="100" height="80" rx="10" fill="#1e1b36" stroke="#10b981" stroke-width="1.5"/>
    <path d="M20,30 L45,55 L80,20" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(500, 110)">
    <rect width="100" height="80" rx="10" fill="#1e1b36" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="15" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M55,30 L75,30 M55,40 L75,40 M55,50 L75,50" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Left -->
  <g transform="translate(130, 210)">
    <rect width="100" height="80" rx="10" fill="#1e1b36" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M25,25 H75 M25,40 H75 M25,55 H55" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Right -->
  <g transform="translate(570, 210)">
    <rect width="100" height="80" rx="10" fill="#1e1b36" stroke="#10b981" stroke-width="1.5"/>
    <path d="M30,30 L50,50 L70,30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="8" fill="#10b981"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(230, 330)">
    <rect width="100" height="80" rx="10" fill="#1e1b36" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="50" cy="40" r="12" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M30,55 A20,20 0 0,1 70,55" fill="none" stroke="#10b981" stroke-width="2"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(470, 330)">
    <rect width="100" height="80" rx="10" fill="#1e1b36" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M35,25 H65 M35,40 H65 M35,55 H65" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Central Shield/COE Emblem -->
  <g transform="translate(360, 210)">
    <path d="M 40,0 L 80,15 L 80,50 C 80,75 40,90 40,90 C 40,90 0,75 0,50 L 0,15 Z" fill="url(#grad1)" stroke="#10b981" stroke-width="2" />
    <path d="M 40,10 L 70,22 L 70,48 C 70,68 40,80 40,80 C 40,80 10,68 10,48 L 10,22 Z" fill="#0b0a12" opacity="0.3" />
    <!-- Star/Core -->
    <path d="M 40,25 L 43,35 L 53,35 L 45,41 L 48,51 L 40,45 L 32,51 L 35,41 L 27,35 L 37,35 Z" fill="#ffffff" />
  </g>
</svg>
