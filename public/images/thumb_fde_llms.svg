<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0a12"/>
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#1c1a2e" stroke-width="1"/>

  <!-- Glow effects -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="250" r="250" fill="url(#glow)" />
  <circle cx="500" cy="200" r="180" fill="url(#glow2)" />

  <!-- Brain/Network Nodes and Paths -->
  <g stroke="#2d2b47" stroke-width="2">
    <!-- Left Hem -->
    <line x1="320" y1="200" x2="280" y2="150" />
    <line x1="320" y1="200" x2="260" y2="220" />
    <line x1="320" y1="200" x2="300" y2="280" />
    <line x1="280" y1="150" x2="200" y2="180" />
    <line x1="260" y1="220" x2="200" y2="180" />
    <line x1="300" y1="280" x2="240" y2="340" />
    <line x1="260" y1="220" x2="240" y2="340" />
    
    <!-- Central Bridge -->
    <line x1="320" y1="200" x2="480" y2="200" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="300" y1="280" x2="500" y2="280" stroke="#10b981" stroke-width="2" />
    
    <!-- Right Hem -->
    <line x1="480" y1="200" x2="520" y2="150" />
    <line x1="480" y1="200" x2="540" y2="220" />
    <line x1="480" y1="200" x2="500" y2="280" />
    <line x1="520" y1="150" x2="600" y2="180" />
    <line x1="540" y1="220" x2="600" y2="180" />
    <line x1="500" y1="280" x2="560" y2="340" />
    <line x1="540" y1="220" x2="560" y2="340" />
  </g>

  <!-- Left Side Nodes (Blue Grad) -->
  <circle cx="320" cy="200" r="16" fill="url(#grad1)" stroke="#3b82f6" stroke-width="2" />
  <circle cx="280" cy="150" r="10" fill="#3b82f6" />
  <circle cx="260" cy="220" r="12" fill="#3b82f6" />
  <circle cx="300" cy="280" r="14" fill="url(#grad1)" stroke="#3b82f6" stroke-width="2" />
  <circle cx="200" cy="180" r="8" fill="#1d4ed8" />
  <circle cx="240" cy="340" r="10" fill="#1d4ed8" />

  <!-- Right Side Nodes (Green Grad) -->
  <circle cx="480" cy="200" r="16" fill="url(#grad2)" stroke="#10b981" stroke-width="2" />
  <circle cx="520" cy="150" r="12" fill="#10b981" />
  <circle cx="540" cy="220" r="10" fill="#10b981" />
  <circle cx="500" cy="280" r="16" fill="url(#grad2)" stroke="#10b981" stroke-width="2" />
  <circle cx="600" cy="180" r="10" fill="#047857" />
  <circle cx="560" cy="340" r="12" fill="#047857" />

  <!-- Abstract semantic loops (orbit tracks) -->
  <ellipse cx="400" cy="250" rx="300" ry="120" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(-15 400 250)"/>
  <ellipse cx="400" cy="250" rx="280" ry="140" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(15 400 250)"/>

  <!-- Database vectors connected at bottom -->
  <g transform="translate(360, 390)">
    <rect x="0" y="0" width="80" height="40" rx="8" fill="#1e1b36" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="40" y1="0" x2="40" y2="-50" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse cx="40" cy="10" rx="30" ry="6" fill="#3b82f6" />
    <path d="M10,10 A30,6 0 0,0 70,10 L70,30 A30,6 0 0,1 10,30 Z" fill="#2d2952" stroke="#3b82f6" stroke-width="1.5" />
    <ellipse cx="40" cy="30" rx="30" ry="6" fill="#3b82f6" />
  </g>
</svg>
