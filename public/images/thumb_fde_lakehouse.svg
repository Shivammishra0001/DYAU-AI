<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0a12"/>
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#1c1a2e" stroke-width="1"/>

  <!-- Glow effects -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="250" r="230" fill="url(#glow)" />

  <!-- Ingestion path vectors -->
  <g stroke="#2d2b47" stroke-width="2" fill="none">
    <path d="M 150,150 L 300,250" />
    <path d="M 150,350 L 300,250" />
    <path d="M 300,250 L 460,250" stroke="#10b981" stroke-width="2.5" />
    <path d="M 540,250 L 650,250" stroke="#3b82f6" stroke-width="2.5" />
  </g>

  <!-- Left source nodes -->
  <circle cx="150" cy="150" r="14" fill="#1e1b36" stroke="#3b82f6" stroke-width="2" />
  <path d="M 142,150 H 158 M 150,142 V 158" stroke="#3b82f6" stroke-width="2"/>
  
  <circle cx="150" cy="350" r="14" fill="#1e1b36" stroke="#3b82f6" stroke-width="2" />
  <circle cx="150" cy="350" r="6" fill="#3b82f6" />

  <!-- Unified Lakehouse Cylinder Core -->
  <g transform="translate(460, 180)">
    <rect x="0" y="0" width="80" height="140" rx="10" fill="#1e1b36" stroke="url(#cylinderGrad)" stroke-width="2" />
    <ellipse cx="40" cy="20" rx="30" ry="8" fill="#10b981" />
    <path d="M 10,20 A 30,8 0 0,0 70,20 L 70,60 A 30,8 0 0,1 10,60 Z" fill="#242142" stroke="#10b981" stroke-width="1.5" />
    
    <ellipse cx="40" cy="60" rx="30" ry="8" fill="#3b82f6" />
    <path d="M 10,60 A 30,8 0 0,0 70,60 L 70,100 A 30,8 0 0,1 10,100 Z" fill="#172d54" stroke="#3b82f6" stroke-width="1.5" />

    <ellipse cx="40" cy="100" rx="30" ry="8" fill="#10b981" />
    <ellipse cx="40" cy="120" rx="30" ry="8" fill="#3b82f6" opacity="0.5" />
  </g>

  <!-- Center Hub (Unified Metadata Unity Catalog) -->
  <g transform="translate(300, 220)">
    <rect width="60" height="60" rx="12" fill="#1e1b36" stroke="#10b981" stroke-width="2" />
    <circle cx="30" cy="30" r="12" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="30" cy="30" r="4" fill="#3b82f6"/>
  </g>

  <!-- Output analytics node -->
  <circle cx="650" cy="250" r="16" fill="#1e1b36" stroke="#3b82f6" stroke-width="2" />
  <path d="M 642,258 V 246 M 650,258 V 238 M 658,258 V 242" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
</svg>
