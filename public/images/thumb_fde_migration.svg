<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0a12"/>
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#1c1a2e" stroke-width="1"/>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="250" r="230" fill="url(#glow)" />

  <!-- Migration sync track -->
  <ellipse cx="400" cy="250" rx="220" ry="80" fill="none" stroke="#2d2b47" stroke-width="2" />
  <ellipse cx="400" cy="250" rx="220" ry="80" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="15 30" stroke-linecap="round" />

  <!-- Left Server (Source) -->
  <g transform="translate(180, 180)">
    <rect width="100" height="140" rx="8" fill="#1e1b36" stroke="#3b82f6" stroke-width="2"/>
    <rect x="10" y="20" width="80" height="20" rx="3" fill="#0b0a12" stroke="#2d2b47" stroke-width="1.5" />
    <circle cx="80" cy="30" r="4" fill="#3b82f6"/>
    <rect x="10" y="60" width="80" height="20" rx="3" fill="#0b0a12" stroke="#2d2b47" stroke-width="1.5" />
    <circle cx="80" cy="70" r="4" fill="#3b82f6"/>
    <rect x="10" y="100" width="80" height="20" rx="3" fill="#0b0a12" stroke="#2d2b47" stroke-width="1.5" />
    <circle cx="80" cy="110" r="4" fill="#3b82f6" opacity="0.3"/>
  </g>

  <!-- Right Server (Target) -->
  <g transform="translate(520, 180)">
    <rect width="100" height="140" rx="8" fill="#1e1b36" stroke="#10b981" stroke-width="2"/>
    <rect x="10" y="20" width="80" height="20" rx="3" fill="#0b0a12" stroke="#2d2b47" stroke-width="1.5" />
    <circle cx="80" cy="30" r="4" fill="#10b981"/>
    <rect x="10" y="60" width="80" height="20" rx="3" fill="#0b0a12" stroke="#2d2b47" stroke-width="1.5" />
    <circle cx="80" cy="70" r="4" fill="#10b981"/>
    <rect x="10" y="100" width="80" height="20" rx="3" fill="#0b0a12" stroke="#2d2b47" stroke-width="1.5" />
    <circle cx="80" cy="110" r="4" fill="#10b981"/>
  </g>

  <!-- Flow indicators/Sync loops -->
  <path d="M 330,210 L 470,210" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 5" />
  <polygon points="475,210 465,205 465,215" fill="#3b82f6" />

  <path d="M 470,290 L 330,290" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" />
  <polygon points="325,290 335,285 335,295" fill="#10b981" />

  <!-- Circular Arrow in center representing translation/validation -->
  <g transform="translate(370, 220)">
    <circle cx="30" cy="30" r="30" fill="#1e1b36" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 20,30 A 10,10 0 1,1 40,30" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 40,30 A 10,10 0 1,1 20,30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
