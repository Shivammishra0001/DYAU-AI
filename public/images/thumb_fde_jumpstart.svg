<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0a12"/>
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500" stroke="#1c1a2e" stroke-width="1"/>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="250" r="230" fill="url(#glow)" />

  <!-- Code/Developer Terminal Hub -->
  <g transform="translate(280, 150)">
    <rect width="240" height="160" rx="12" fill="#1e1b36" stroke="#10b981" stroke-width="2.5" />
    <path d="M 10,15 L 20,25 L 10,35 M 30,30 H 70" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="55" width="220" height="15" rx="3" fill="#0b0a12" opacity="0.6"/>
    <rect x="10" y="80" width="160" height="15" rx="3" fill="#0b0a12" opacity="0.6"/>
    <rect x="10" y="105" width="190" height="15" rx="3" fill="#0b0a12" opacity="0.6"/>
    <!-- Code terminal base -->
    <path d="M 60,160 L 180,160 L 200,185 L 40,185 Z" fill="#2d2952" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Speed/Acceleration lines (Launch) -->
  <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round">
    <line x1="580" y1="120" x2="680" y2="120" stroke-dasharray="15 10"/>
    <line x1="560" y1="160" x2="640" y2="160" stroke-dasharray="10 10"/>
    <line x1="600" y1="200" x2="660" y2="200" stroke-dasharray="5 10"/>
  </g>
  <path d="M 690,120 L 710,120 L 700,110 Z" fill="#3b82f6" />

  <!-- Connection Nodes -->
  <g stroke="#2d2b47" stroke-width="1.5">
    <line x1="280" y1="230" x2="160" y2="230"/>
    <line x1="160" y1="230" x2="120" y2="230"/>
    <line x1="160" y1="230" x2="120" y2="150"/>
    <line x1="160" y1="230" x2="120" y2="310"/>
  </g>
  <circle cx="160" cy="230" r="10" fill="#10b981"/>
  <circle cx="120" cy="150" r="6" fill="#3b82f6"/>
  <circle cx="120" cy="230" r="6" fill="#3b82f6"/>
  <circle cx="120" cy="310" r="6" fill="#3b82f6"/>
</svg>
