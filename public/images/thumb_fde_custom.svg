<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0a12"/>
  
  <!-- Subtle Grid Lines (more prominent blueprint grid) -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 50,0 L 50,500 M 100,0 L 100,500 M 150,0 L 150,500 M 200,0 L 200,500 M 250,0 L 250,500 M 300,0 L 300,500 M 350,0 L 350,500 M 400,0 L 400,500 M 450,0 L 450,500 M 500,0 L 500,500 M 550,0 L 550,500 M 600,0 L 600,500 M 650,0 L 650,500 M 700,0 L 700,500 M 750,0 L 750,500" stroke="#161b36" stroke-width="1"/>

  <!-- Glow effects -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="250" r="230" fill="url(#glow)" />

  <!-- Coordinate Axes -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="400" y1="50" x2="400" y2="450" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Concentric circles representing drafting -->
  <circle cx="400" cy="250" r="100" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="400" cy="250" r="160" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />
  <circle cx="400" cy="250" r="200" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />

  <!-- Blueprint Polygon Shapes / Solver Paths -->
  <polygon points="400,90 560,250 400,410 240,250" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round" />
  <polygon points="400,150 500,250 400,350 300,250" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 5" />
  
  <!-- Drafting Compass drawing the arc -->
  <g transform="translate(400, 250) rotate(-45)">
    <!-- Leg 1 of compass -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-180" x2="0" y2="-200" stroke="#94a3b8" stroke-width="4"/>
    <!-- Leg 2 of compass (drawing leg) -->
    <line x1="0" y1="0" x2="113" y2="113" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="113" y1="113" x2="125" y2="125" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Joint hinge -->
    <circle cx="0" cy="0" r="10" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#cbd5e1" />
  </g>

  <!-- Drawing Pencil point indicator/glow -->
  <circle cx="480" cy="330" r="6" fill="#3b82f6" />
  <circle cx="480" cy="330" r="15" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
  
  <!-- Caliper dimensions -->
  <path d="M 240,250 L 240,270 M 560,250 L 560,270" stroke="#3b82f6" stroke-width="1" />
  <path d="M 240,265 L 560,265" stroke="#3b82f6" stroke-width="1" />
  <g fill="#3b82f6" font-size="10" font-family="monospace">
    <text x="375" y="280">d=320px</text>
  </g>

  <!-- Blueprint corner brackets -->
  <path d="M 40,60 L 40,40 L 60,40 M 740,60 L 740,40 L 720,40 M 40,440 L 40,460 L 60,460 M 740,440 L 740,460 L 720,460" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.4" />
</svg>
